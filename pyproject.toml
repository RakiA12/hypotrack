[project]
name = "hypotrack"
version = "0.1.0"
description = "Context management CLI for hypothesis-driven ML experiments (hypothesis -> experiment -> result loop for coding agents)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
hypotrack = "hypotrack.cli:main"
hypx = "hypotrack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypotrack"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
